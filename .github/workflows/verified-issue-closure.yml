# One-time issue closure; restricted branch and repository, no checkout or external actions.
name: Close verified retention issue
on:
  push:
    branches: [arena/328e63a8-archx-rl]
    paths: ['.github/workflows/verified-issue-closure.yml']
permissions:
  issues: write
jobs:
  close:
    if: github.repository == 'archnemix/Archx-RL' && github.ref == 'refs/heads/arena/328e63a8-archx-rl'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close tested scoped retention issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close 14 --repo archnemix/Archx-RL --reason completed --comment 'Implemented on arena/328e63a8-archx-rl at a03aa7e (not merged into main): optional supervised idle expiry of engine/replay data, explicitly configured removal of the recognized retired trial schema, narrowly named old backups in a private directory, and passive WAL checkpoints. Docs/Guides/Retention.md documents destructive opt-ins, logical-versus-physical erasure, backup and WAL limits. tests/test_retention.py and test_idle_cleanup.py cover idle expiration, live preservation, rollback, selection, held-open unlinked data and pinned WAL reader behavior. Local full browser/sanitizer suite and Linux CI https://github.com/archnemix/Archx-RL/actions/runs/45862203500 passed. Destructive operations are disabled by default; legacy purge deletes all recognized trial records, unlink/checkpoint are not secure erasure, operations are not jointly atomic, and real backup governance and production recovery remain operator responsibilities.'
