# One-time issue closure; restricted branch and repository, no checkout or external actions.
name: Close verified signal validation issue
on:
  push:
    branches: [arena/328e63a8-archx-rl]
    paths: ['.github/workflows/verified-issue-closure.yml']
permissions:
  issues: write
jobs:
  close:
    if: github.repository == 'archnemix/Archx-RL' && github.ref == 'refs/heads/arena/328e63a8-archx-rl'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close tested signal validation issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close 23 --repo archnemix/Archx-RL --reason completed --comment 'Implemented on arena/328e63a8-archx-rl at 75e00bb (not merged into main). Docs/Research/Signal-Normalization.md documents source-specific Linux native, Python and experimental Windows/macOS rules and limitations. Linux C now rejects partial/embedded-NUL reads, I/O failures, malformed machine IDs/UUIDs and invalid or placeholder serials; SMBIOS fixtures cover vendor variants, UUID byte order, malformed/truncated data, Unicode, ambiguity and absence. Tests include test_linux_signal_validation.c, test_smbios.c and Python RawSignalTests. Full local browser/sanitizer regression and Linux CI https://github.com/archnemix/Archx-RL/actions/runs/45859757280 passed; native primitive CI https://github.com/archnemix/Archx-RL/actions/runs/45859757634 passed. Conservative validation may exclude legitimate vendor values or change derived identifiers on upgrade; syntax does not prove authenticity, uniqueness, production safety, supported Windows/macOS collection or real-device coverage.'
