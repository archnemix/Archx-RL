# One-time closure of verified security policy and threat inventory.
name: Close verified security policy issue
on:
  push:
    branches: [arena/328e63a8-archx-rl]
    paths: ['.github/workflows/verified-issue-closure.yml']
permissions:
  issues: write
jobs:
  close:
    if: github.repository == 'archnemix/Archx-RL' && github.ref == 'refs/heads/arena/328e63a8-archx-rl'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close tested security policy issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close 2 --repo archnemix/Archx-RL --reason completed --comment 'Security policy and threat-model updates are on arena/328e63a8-archx-rl at 97c99d5 (not yet merged into main). The owner enabled GitHub private vulnerability reporting, verified through the GitHub repository setting; SECURITY.md gives the private report URL and notes that outside-reporter submission and maintainer notification are not yet tested. Docs/Threat-Model.md describes assets, attacker control, trust boundaries, evasion, poisoning, shared NAT and recovery, and links each enumerated threat to a named synthetic regression. A new negative key-substitution test demonstrates the independent trusted-key requirement; the traceability test checks each reference. Local full browser/sanitizer regression and Linux CI https://github.com/archnemix/Archx-RL/actions/runs/46109315702 passed. These tests do not prove mitigation of every threat, formal acceptance of residual risks or independent security review. Signals remain forgeable and are not authentication; production deployment and remaining release gates remain open.'
