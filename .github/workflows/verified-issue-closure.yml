# One-time closure of reviewed issue; no checkout or external actions.
name: Close verified metrics issue
on:
  push:
    branches: [arena/328e63a8-archx-rl]
    paths: ['.github/workflows/verified-issue-closure.yml']
permissions:
  issues: write
jobs:
  close:
    if: github.repository == 'archnemix/Archx-RL' && github.ref == 'refs/heads/arena/328e63a8-archx-rl'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close tested metrics issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close 11 --repo archnemix/Archx-RL --reason completed --comment 'Implemented on branch arena/328e63a8-archx-rl at 36b1e8e (not merged into main): optional fixed-cardinality process-local decision, latency, capacity/storage-denial, replay/adapter outcome and memory/SQLite serialization-wait metrics; tests/test_metrics.py validates synthetic failures, contention, privacy and instrumentation isolation. tools/synthetic_metrics_dashboard.py demonstrates illustrative alerts; its 51ms contention sample is injected, not a performance result. Local browser/sanitizer full suite and Linux CI https://github.com/archnemix/Archx-RL/actions/runs/45836829981 passed. No raw identifiers or per-IP/device labels are retained. This is not a production monitoring deployment: no exporter, persistent aggregation, occupancy gauge, pre-service/queue coverage or tuned thresholds; operator monitoring remains necessary.'
