# One-time closure of the tested capability schema; no checkout or external actions.
name: Close verified capability schema issue
on:
  push:
    branches: [arena/328e63a8-archx-rl]
    paths: ['.github/workflows/verified-issue-closure.yml']
permissions:
  issues: write
jobs:
  close:
    if: github.repository == 'archnemix/Archx-RL' && github.ref == 'refs/heads/arena/328e63a8-archx-rl'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close tested capability schema issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close 8 --repo archnemix/Archx-RL --reason completed --comment 'Implemented on arena/328e63a8-archx-rl at a9cd87f (not merged into main): versioned archx.capabilities metadata distinguishes OS-install, firmware, app-install and host-provided network categories. Linux collection reports available, absent, denied, placeholder, invalid and read-error statuses with explicit machine-id fallback precedence; browser capability metadata reports native sources unsupported without collecting them. Output contains no raw identifiers. Synthetic injected-source fixtures exercise denial, read errors, placeholders and fallback; browser Node and real Chromium tests cover the distinct schema; C output/allocation fault tests and both bindings cover the extension and compatibility with older ABI-v1 libraries. Linux CI https://github.com/archnemix/Archx-RL/actions/runs/45875737428 and native primitive CI https://github.com/archnemix/Archx-RL/actions/runs/45875737440 passed. This is a Linux/browser schema, not Windows/macOS full collector support, authentication or a production release.'
