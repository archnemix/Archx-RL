# One-time, explicitly authorized closure of reviewed issues on this branch.
# No checkout, third-party action, untrusted input, or user-provided secret.
name: Close verified issues
on:
  push:
    branches: [arena/328e63a8-archx-rl]
    paths: ['.github/workflows/verified-issue-closure.yml']
permissions:
  issues: write
jobs:
  close:
    if: github.repository == 'archnemix/Archx-RL' && github.ref == 'refs/heads/arena/328e63a8-archx-rl'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close reviewed performance investigations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue close 37 --repo archnemix/Archx-RL --reason completed --comment 'Implemented and measured on branch arena/328e63a8-archx-rl (not yet merged into main): Docs/Plan/Next-Version.md records mutex/writer wait and held p50/p95/p99, synthetic concurrent no-excess-admission tests, indexed vs historical sparse matching measurements, and semantics required before sharding. Linux regression at 624d931 passed: https://github.com/archnemix/Archx-RL/actions/runs/45829816434. Measurements are synthetic and process-local; no production performance, multiprocess correctness, generalized contention reduction or sharding is claimed. SQLite writer contention and memory full-window scans remain limitations.'
          gh issue close 40 --repo archnemix/Archx-RL --reason completed --comment 'Implemented on branch arena/328e63a8-archx-rl (not yet merged into main): C admission probes once, preserves active buckets at saturation, and safely rejects constructor size overflow. Collision-chain, full saturation and reset-shift fixtures run in tests/test_platform.c. Docs/Plan/Next-Version.md documents worst-case probe counts and synthetic collision timings without claiming bounded wall-clock latency. Linux regression at 89784a7 passed: https://github.com/archnemix/Archx-RL/actions/runs/45828707319; native primitive fixtures passed on Windows/macOS: https://github.com/archnemix/Archx-RL/actions/runs/45828707384. Contention and maximum-capacity wall time remain unproven.'
