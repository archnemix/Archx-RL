# One-time issue closure; restricted branch and repository, no checkout or external actions.
name: Close verified SQLite profiling issue
on:
  push:
    branches: [arena/328e63a8-archx-rl]
    paths: ['.github/workflows/verified-issue-closure.yml']
permissions:
  issues: write
jobs:
  close:
    if: github.repository == 'archnemix/Archx-RL' && github.ref == 'refs/heads/arena/328e63a8-archx-rl'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close tested synthetic SQLite profiling issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close 39 --repo archnemix/Archx-RL --reason completed --comment 'Synthetic profile implemented on arena/328e63a8-archx-rl at 1b770c8 (not merged into main): Docs/Research/SQLite-Contention-Profile.md and tools/sqlite_soak_profile.py document 30 seconds of concurrent four-writer/two-reader/two-replay load, connection churn, indexed query plans, writer waits, WAL/checkpoints, latency and CPU. All 17,747 writer charges were atomic with 100 allows, each replay token had one winner, and 297 injected read-only write/replay failures preserved a reserved token for recovery. Existing tests inject partial-charge rollback, busy and missing-schema faults; tests/test_sqlite_soak_profile.py checks shorter concurrent invariant smoke. Full browser/sanitizer suite and Linux CI https://github.com/archnemix/Archx-RL/actions/runs/45859314527 passed. This is synthetic single-host evidence, not a multi-hour soak, production capacity/latency budget, disk-full, power-loss, rollback-resistance or durability certification.'
