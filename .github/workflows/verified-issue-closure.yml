# One-time issue closure; restricted branch and repository, no checkout or external actions.
name: Close verified shared-IP recovery issue
on:
  push:
    branches: [arena/328e63a8-archx-rl]
    paths: ['.github/workflows/verified-issue-closure.yml']
permissions:
  issues: write
jobs:
  close:
    if: github.repository == 'archnemix/Archx-RL' && github.ref == 'refs/heads/arena/328e63a8-archx-rl'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close tested prototype shared-IP issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close 24 --repo archnemix/Archx-RL --reason completed --comment 'Implemented on arena/328e63a8-archx-rl at 2842d83 (not merged into main): separate IP/device thresholds, opt-in progressive IP challenge and a privileged IP-window reset, with a disabled-by-default WSGI example requiring independent host principal, authorization, approval and audit hooks. tests/test_progressive_recovery.py exercises memory/SQLite charging, reset, authorization and faults; synthetic NAT simulations and explicit assumptions are in Docs/Guides/Shared-IP-Recovery.md. Full local browser/sanitizer tests and Linux CI https://github.com/archnemix/Archx-RL/actions/runs/45861558417 passed. IP is not a person, signals are forgeable, and resetting a shared IP also benefits attackers; a challenge is a denial requiring host review, not an automated verifier. The example lacks production identity, CSRF, durable audit, recovery throttling and TLS and must not be exposed as a supported recovery service.'
