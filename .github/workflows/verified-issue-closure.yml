# One-time closure of the verified binding issue; no checkout or external actions.
name: Close verified binding issue
on:
  push:
    branches: [arena/328e63a8-archx-rl]
    paths: ['.github/workflows/verified-issue-closure.yml']
permissions:
  issues: write
jobs:
  close:
    if: github.repository == 'archnemix/Archx-RL' && github.ref == 'refs/heads/arena/328e63a8-archx-rl'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close tested binding issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close 31 --repo archnemix/Archx-RL --reason completed --comment 'Implemented on arena/328e63a8-archx-rl at e80fcc0 (not merged into main): repository Python and Node source packages replace duplicated example FFI code, require an explicit trusted library path and validate ABI v1. Both exercise the same synthetic protocol fixture, native errors and deterministic buffer ownership faults including decoding errors and incorrect ABI. Tests also exercise relocated libraries and isolated package installation; Python serializes operations with close. Linux x86-64 is the only advertised binding target; Windows, macOS and other architectures are not claimed. Local full browser/sanitizer regression and Linux CI https://github.com/archnemix/Archx-RL/actions/runs/45874610344 passed, including both binding fixtures and package installs. The bindings and core remain experimental, unreleased and not a production deployment or authentication mechanism; native-platform release issues remain open.'
