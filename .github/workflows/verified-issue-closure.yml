# One-time closure of a reviewed issue on the session branch; no checkout or external actions.
name: Close verified issue 21
on:
  push:
    branches: [arena/328e63a8-archx-rl]
    paths: ['.github/workflows/verified-issue-closure.yml']
permissions:
  issues: write
jobs:
  close:
    if: github.repository == 'archnemix/Archx-RL' && github.ref == 'refs/heads/arena/328e63a8-archx-rl'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close tested C fault propagation issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close 21 --repo archnemix/Archx-RL --reason completed --comment 'Implemented on branch arena/328e63a8-archx-rl at db8ca0e (not merged into main): C builder/digest formatting, parser/output/core/store allocations, mutex/clock, entropy and Linux fallback persistence errors fail closed and propagate explicit errors. Synthetic failure-injection fixtures include tests/test_output_faults.c, test_json_faults.c, test_core_alloc_faults.c, test_store_faults.c and test_fallback_faults.c. Browser and sanitizer regression passed locally; Linux CI passed https://github.com/archnemix/Archx-RL/actions/runs/45835174956. Failed unlock/close can follow a charge, reset or write and does not imply rollback; crash durability and every OS error remain outside these targeted tests.'
