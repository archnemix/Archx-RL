# One-time, explicitly authorized closure of reviewed issues on this branch.
# No checkout, third-party action, untrusted input, or user-provided secret.
name: Close verified issues
on:
  push:
    branches: [arena/328e63a8-archx-rl]
    paths: ['.github/workflows/verified-issue-closure.yml']
permissions:
  issues: write
jobs:
  close:
    if: github.repository == 'archnemix/Archx-RL' && github.ref == 'refs/heads/arena/328e63a8-archx-rl'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close reviewed contract, documentation, and indexing fixes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue close 20 --repo archnemix/Archx-RL --reason completed --comment 'Implemented on branch arena/328e63a8-archx-rl (not yet merged into main): Docs/Plan/Engine-Contract.md specifies duplicate refresh, expiry, saturation, charging and retries, including explicit memory/SQLite cleanup divergence. Shared scenarios are in tests/test_sqlite_engine.py and tests/test_observation_index.py. Linux full regression passed at c3fb75e: https://github.com/archnemix/Archx-RL/actions/runs/45822536439.'
          gh issue close 28 --repo archnemix/Archx-RL --reason completed --comment 'Implemented on branch arena/328e63a8-archx-rl (not yet merged into main): ABI-v1 confidence is documented as an uncalibrated availability-weight heuristic rather than identity or fraud probability. tests/test_coverage.c and tests/test_coverage_docs.py exercise the API and descriptions. Linux full regression passed at c3fb75e: https://github.com/archnemix/Archx-RL/actions/runs/45822536439. This preserves the ABI rather than introducing a renamed field.'
          gh issue close 32 --repo archnemix/Archx-RL --reason completed --comment 'Evaluation documented on branch arena/328e63a8-archx-rl (not yet merged into main): Docs/Plan/Crypto-JSON-ADR.md compares license, source size and security/migration considerations and sets explicit gates before provider replacement. No provider or format was changed. Synthetic known-answer and differential crypto and JSON contract fixtures passed Windows and macOS Intel/ARM: https://github.com/archnemix/Archx-RL/actions/runs/45822536569 and Linux: https://github.com/archnemix/Archx-RL/actions/runs/45822536439. Native fixtures are not a full native product build or external security audit.'
          gh issue close 33 --repo archnemix/Archx-RL --reason completed --comment 'Implemented on branch arena/328e63a8-archx-rl (not yet merged into main): README maps the separate native core, policy service, browser protocol, privacy/security and deployment guides in Docs/Guides. tests/test_guides.py checks links and scope disclaimers. Linux full regression passed at c3fb75e: https://github.com/archnemix/Archx-RL/actions/runs/45822536439. The guides do not assert production readiness.'
          gh issue close 34 --repo archnemix/Archx-RL --reason completed --comment 'Implemented on branch arena/328e63a8-archx-rl (not yet merged into main): demo/observation_index.py indexes name/token pairs by observation ID and counts matches separately per snapshot. tests/test_observation_index.py compares a seeded linear oracle and checks distinct observations cannot be combined. Linux full regression passed at c3fb75e: https://github.com/archnemix/Archx-RL/actions/runs/45822536439.'
          gh issue close 35 --repo archnemix/Archx-RL --reason completed --comment 'Implemented on branch arena/328e63a8-archx-rl (not yet merged into main): identical in-memory snapshots reuse a slot and refresh expiry. tests/test_observation_index.py and tests/test_sqlite_engine.py exercise duplicate capacity, refresh and SQLite parity. Linux full regression passed at c3fb75e: https://github.com/archnemix/Archx-RL/actions/runs/45822536439.'
