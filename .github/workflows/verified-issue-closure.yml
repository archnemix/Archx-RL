# One-time issue closure; restricted branch and repository, no checkout or external actions.
name: Close verified synthetic benchmark issue
on:
  push:
    branches: [arena/328e63a8-archx-rl]
    paths: ['.github/workflows/verified-issue-closure.yml']
permissions:
  issues: write
jobs:
  close:
    if: github.repository == 'archnemix/Archx-RL' && github.ref == 'refs/heads/arena/328e63a8-archx-rl'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close tested traffic matrix issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close 38 --repo archnemix/Archx-RL --reason completed --comment 'Synthetic benchmark coverage implemented on arena/328e63a8-archx-rl at 065fb17 (not merged into main): Docs/Research/Traffic-Matrix-Benchmark.md and Docs/Test-Results/unreleased/traffic-matrix.json record 48 memory/SQLite cases spanning empty through saturated, direct/loopback HTTP, allowed, denied, invalid and sealed traffic. The report includes dataset, host, throughput, latency percentiles, process CPU/RSS, errors, generator outstanding work, handler concurrency, sparse listen-queue samples and expiry recovery. tests/test_traffic_matrix.py verifies decisions and accounting without timing targets. Local browser/sanitizer regression and Linux CI https://github.com/archnemix/Archx-RL/actions/runs/45860737074 passed. Sampling is sequential and queue observations can miss peaks; this is not a representative production load, TLS/proxy test, multi-host soak or agreed capacity budget.'
