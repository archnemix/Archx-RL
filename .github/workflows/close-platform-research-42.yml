# One-time issue-42 close, restricted to the reviewed ADR parent commit.
name: Close completed platform research issue
on:
  push:
    branches: [arena/328e63a8-archx-rl]
permissions:
  contents: read
  issues: write
jobs:
  close:
    if: github.repository == 'archnemix/Archx-RL' && github.event.before == '63aeb40a4e4a8fcc23efc6a940af329f31e1d2fc'
    runs-on: ubuntu-latest
    steps:
      - name: Record evidence and close research issue 42
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api repos/archnemix/Archx-RL/issues/42/comments --method POST -f 'body=Completed the research/ADR scope in commit 63aeb40: Docs/Research/Platform-ADRs.md records Windows RSMB, research-gated MachineGuid, deferred Windows fallback, macOS IOKit/privacy, and deferred macOS fallback decisions, sources, permissions, native runner evidence, failure cases and uncertainties. Regression: Linux 46147837197, native platform 46147837104, native bindings 46147837127 and coverage 46147837114 passed. This does not claim Windows/macOS product support, secure fallback implementation, physical-device evidence, or legal/distribution approval; those remain under their product and release issues.' --silent
          gh api repos/archnemix/Archx-RL/issues/42 --method PATCH -f state=closed -f state_reason=completed --silent
