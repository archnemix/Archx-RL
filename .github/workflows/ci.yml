# Untrusted PR code runs with read-only repository access and no project secrets.
name: Linux regression

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: linux-regression-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux full regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test dependencies
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/archx-test-venv"
          "$RUNNER_TEMP/archx-test-venv/bin/pip" install -r demo/requirements-secure.txt -r tests/requirements-proxy.txt
          echo "$RUNNER_TEMP/archx-test-venv/bin" >> "$GITHUB_PATH"
          npm ci --prefix demo/browser
          npm ci --prefix bindings/node
          npm run build --prefix demo/browser
          echo 'ARCHX_REQUIRE_BINDINGS=1' >> "$GITHUB_ENV"
          if command -v google-chrome >/dev/null 2>&1; then
            echo "ARCHX_TEST_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            (cd demo/browser && npx playwright install --with-deps chromium)
          fi
          echo 'ARCHX_REQUIRE_BROWSER=1' >> "$GITHUB_ENV"
      - name: Build and test
        run: ./test.sh
      - name: Install and exercise isolated native binding packages
        run: sh tests/test_binding_packaging.sh
      - name: Install and exercise isolated WSGI integration
        run: sh tests/test_wsgi_package_install.sh
      - name: Real TLS proxy experiment (private demo only)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          nginx -v
          # Capture test failures as annotations as well as ordinary logs.
          run_proxy_test() {
            local log="$RUNNER_TEMP/proxy-test.log"
            if "$@" >"$log" 2>&1; then
              cat "$log"
            else
              cat "$log"
              python3 -c 'import pathlib,sys; s=pathlib.Path(sys.argv[1]).read_text(); print("::error::" + s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))' "$log"
              return 1
            fi
          }
          run_proxy_test env ARCHX_TEST_NGINX="$(command -v nginx)" python3 tests/test_https_proxy.py
          run_proxy_test env ARCHX_TEST_NGINX="$(command -v nginx)" ARCHX_TEST_OTHER_USER=nobody python3 tests/test_https_wsgi_unix.py
          run_proxy_test env ARCHX_TEST_NGINX="$(command -v nginx)" ARCHX_TEST_OTHER_USER=nobody python3 tests/test_experimental_ingress.py
          sudo groupadd archxsocket
          sudo useradd --no-create-home --shell /usr/sbin/nologin archxproxy
          sudo useradd --no-create-home --shell /usr/sbin/nologin archxdenied
          sudo usermod -a -G archxsocket "$(id -un)"
          run_proxy_test env ARCHX_TEST_NGINX="$(command -v nginx)" ARCHX_TEST_PROXY_USER=archxproxy ARCHX_TEST_SOCKET_GROUP=archxsocket ARCHX_TEST_DENIED_USER=archxdenied sg archxsocket -c 'python3 tests/test_ingress_peer_uid.py -v'
      - name: Verify clean same-toolchain Linux rebuild
        run: sh tools/reproduce_linux.sh "$GITHUB_SHA"
      - name: Focused GCC analyzer regression
        run: sh tests/test_gcc_analyzer.sh
      - name: Fuzz SMBIOS parser smoke
        run: ./tests/fuzz_smbios.sh
      - name: Fuzz C JSON, config and profile smoke
        run: sh tests/fuzz_core.sh
      - name: Verify Linux GCC and Clang CMake installation and consumers
        run: |
          CC=gcc ./tests/test_cmake_install.sh
          CC=clang ./tests/test_cmake_install.sh
