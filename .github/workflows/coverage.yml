# Synthetic partial reports; not a quality threshold or production evidence.
name: Synthetic coverage
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: synthetic-coverage-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install test-only dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/archx-coverage-venv"
          "$RUNNER_TEMP/archx-coverage-venv/bin/pip" install -r demo/requirements-secure.txt -r tests/requirements-coverage.txt
          echo "$RUNNER_TEMP/archx-coverage-venv/bin" >> "$GITHUB_PATH"
          npm ci --prefix bindings/node
          npm ci --prefix demo/browser
          npm run build --prefix demo/browser
      - name: Run synthetic partial coverage
        run: sh tools/coverage_smoke.sh "$RUNNER_TEMP/archx-coverage"
      - name: Upload separate C, Python and Node reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/archx-coverage/
          retention-days: 7
          if-no-files-found: error
