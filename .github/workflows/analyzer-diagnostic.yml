name: Focused analyzer diagnostic
on:
  push:
    paths:
      - 'tests/test_gcc_analyzer.sh'
      - 'src/archx.c'
permissions:
  contents: read
jobs:
  analyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: sh tests/test_gcc_analyzer.sh
