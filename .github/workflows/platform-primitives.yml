# Experimental entropy/clock/mutex/store adapter conformance only; not native product support.
name: Experimental platform primitives

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: platform-primitives-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Primitives ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: windows-2022
            arch: X64
            cmake_arch: '-A x64'
          - os: macos-15
            arch: ARM64
            cmake_arch: ''
          - os: macos-15-intel
            arch: X64
            cmake_arch: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify runner architecture
        shell: bash
        run: test "$RUNNER_ARCH" = '${{ matrix.arch }}'
      - name: Configure primitive conformance only
        run: cmake -S tests/platform -B build/platform ${{ matrix.cmake_arch }}
      - name: Build primitive conformance
        shell: bash
        run: |
          set +e
          cmake --build build/platform --config Release > "$RUNNER_TEMP/platform-build.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/platform-build.log"
          if [ "$status" -ne 0 ]; then
            grep -iE '(error|warning) C[0-9]+|error:' "$RUNNER_TEMP/platform-build.log" | head -n 10 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"
      - name: Run synthetic parser and native primitive tests
        shell: bash
        run: |
          set +e
          ctest --test-dir build/platform -C Release --verbose > "$RUNNER_TEMP/platform-test.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/platform-test.log"
          if [ "$status" -ne 0 ]; then
            grep -iE 'failed at line|error C[0-9]+|error:' "$RUNNER_TEMP/platform-test.log" | head -n 10 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"
      - name: Differential synthetic SHA/HMAC against native Python
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            export ARCHX_CRYPTO_TEST_LIB="$(cygpath -w "$PWD/build/platform/Release/archx_crypto_fixture.dll")"
            python tests/test_crypto_differential.py
          else
            export ARCHX_CRYPTO_TEST_LIB="$PWD/build/platform/libarchx_crypto_fixture.dylib"
            python3 tests/test_crypto_differential.py
          fi
      # Pushes only: never execute host survey code from untrusted pull requests.
      - name: Build native availability survey
        if: github.event_name == 'push'
        run: |
          cmake -S tools/permission_survey -B build/native-survey ${{ matrix.cmake_arch }}
          cmake --build build/native-survey --config Release
      - name: Survey Windows runner (sanitized categories only)
        if: github.event_name == 'push' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $raw = Join-Path $env:RUNNER_TEMP 'native-survey-input.json'
          try {
            & build/native-survey/Release/native_permission_survey.exe | Out-File -FilePath $raw -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw 'Survey failed' }
            $result = python tools/permission_survey/validate_native.py windows $raw
            if ($LASTEXITCODE -ne 0) { throw 'Survey validation failed' }
            Write-Output "::notice title=Native availability::$result"
          } finally { Remove-Item $raw -ErrorAction SilentlyContinue }
      - name: Survey disposable Windows standard user (sanitized categories only)
        if: github.event_name == 'push' && runner.os == 'Windows' && runner.environment == 'github-hosted'
        shell: pwsh
        run: ./tools/permission_survey/windows_standard_user.ps1
      - name: Survey macOS runner (sanitized categories only)
        if: github.event_name == 'push' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/native-survey-input.json"
          trap 'rm -f "$raw"' EXIT
          build/native-survey/native_permission_survey > "$raw"
          result="$(python3 tools/permission_survey/validate_native.py macos "$raw")"
          echo "::notice title=Native availability::$result"
