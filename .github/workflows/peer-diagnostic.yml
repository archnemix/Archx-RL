name: Temporary peer diagnostic
on:
  push:
    branches: [arena/328e63a8-archx-rl]
    paths: ['.github/workflows/peer-diagnostic.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r demo/requirements-secure.txt -r tests/requirements-proxy.txt
          sudo apt-get update && sudo apt-get install -y nginx
          sudo groupadd archxsocket
          sudo useradd --no-create-home --shell /usr/sbin/nologin archxproxy
          sudo useradd --no-create-home --shell /usr/sbin/nologin archxdenied
          env ARCHX_TEST_NGINX="$(command -v nginx)" ARCHX_TEST_PROXY_USER=archxproxy ARCHX_TEST_SOCKET_GROUP=archxsocket ARCHX_TEST_DENIED_USER=archxdenied "$RUNNER_TEMP/venv/bin/python" tests/test_ingress_peer_uid.py -v > "$RUNNER_TEMP/peer.log" 2>&1 || {
            cat "$RUNNER_TEMP/peer.log"
            python3 -c 'import pathlib,sys; s=pathlib.Path(sys.argv[1]).read_text(); print("::error::" + s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))' "$RUNNER_TEMP/peer.log"
            exit 1
          }
          cat "$RUNNER_TEMP/peer.log"
